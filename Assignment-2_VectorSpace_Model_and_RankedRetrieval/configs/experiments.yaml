  - {alpha: 1.2, beta: 0.6, gamma: 0.2, fb_docs: 15, fb_terms: 40}
  - {alpha: 1.0, beta: 0.3, gamma: 0.0, fb_docs: 5, fb_terms: 10}
  - {alpha: 1.0, beta: 0.4, gamma: 0.05, fb_docs: 20, fb_terms: 50}
  - {alpha: 1.0, beta: 0.75, gamma: 0.0, fb_docs: 8, fb_terms: 30}
  - {alpha: 1.0, beta: 1.0, gamma: 0.15, fb_docs: 10, fb_terms: 30}
retrieval: {top_k: 1000}
terrier: {enabled: true, name: terrier_tfidf_baseline, model: TF_IDF, c: 1.0}
