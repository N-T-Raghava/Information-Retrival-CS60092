preprocessing:
  - {name: stem_stop_title3, stem: true, stopwords: true, title_weight: 3, dedupe_title: false}
  - {name: stem_stop_title3_dedupe, stem: true, stopwords: true, title_weight: 3, dedupe_title: true}
  - {name: stem_stop_title2, stem: true, stopwords: true, title_weight: 2, dedupe_title: false}
  - {name: stem_stop_title2_author_bib, stem: true, stopwords: true, title_weight: 2, include_author: true, include_bib: true}
  - {name: stem_stop_title2_dedupe, stem: true, stopwords: true, title_weight: 2, dedupe_title: true}
  - {name: stem_stop_title1, stem: true, stopwords: true, title_weight: 1}
  - {name: stem_nostop_title1, stem: true, stopwords: false, title_weight: 1}
  - {name: nostem_stop_title1, stem: false, stopwords: true, title_weight: 1}
  - {name: nostem_nostop_title1, stem: false, stopwords: false, title_weight: 1}
